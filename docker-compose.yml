services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: arbitrage
      POSTGRES_PASSWORD: arbitrage
      POSTGRES_DB: arbitrage
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro

volumes:
  pgdata:
